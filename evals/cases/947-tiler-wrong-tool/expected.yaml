id: 947-tiler-wrong-tool
case_type: mutation
modes:
- fixture
score_types:
  fixture: mutation_tests
project_dir: project
hard_gate: true
fixture:
  generator: '{python} {evals_dir}/fixtures/tiler-selection/gen.py {project_dir} --mutation=wrong-tool'
assertions:
- assert: tiling.command_matches
  args:
    path: tiling-plan.json
    field: preview
    expected:
    - tylertoo
    - tiles
    - events.parquet
    - events.pmtiles
    - --min-zoom
    - '4'
    - --max-zoom
    - '14'
    - --layer-name
    - events
  expect: failed
  expect_code: tiler_command_mismatch
- assert: tiling.command_matches
  args:
    path: tiling-plan.json
    field: coverage
    expected:
    - tylertoo
    - tiles
    - cells.parquet
    - cells.pmtiles
    - --min-zoom
    - '4'
    - --max-zoom
    - '8'
    - --layer-name
    - cells
    - --verbatim
- assert: tiling.command_matches
  args:
    path: tiling-plan.json
    field: existing
    expected:
    - tippecanoe
    - --output
    - cities.pmtiles
    - --minimum-zoom
    - '0'
    - --maximum-zoom
    - '10'
    - --layer
    - cities
    - --feature-filter
    - '{"*": [">", "population", 10000]}'
    - cities.geojson
mutation:
  control_generator: '{python} {evals_dir}/fixtures/tiler-selection/gen.py {project_dir}'
