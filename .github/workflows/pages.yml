name: Project homepage

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - site/**
      - scripts/build_project_pages.py
      - scripts/build-claude-skill-package.sh
      - scripts/sync_skill_assets.py
      - collection.json
      - skills/**
      - templates/**
      - openmapstack/schemas/**
      - tests/test_project_pages.py
      - tests/test_observable_cities.py
      - examples/observable-cities/**
      - examples/delivery-profiles/**
      - examples/established-stack/**
      - examples/nyc-private-mobility/dashboard.html
      - examples/nyc-private-mobility/data/derived/**
      - examples/tartu-development/**
      - examples/nyc-private-mobility/project.yaml

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/observable-cities/observable/package-lock.json
      - name: Install project validation dependencies
        run: python3 -m pip install -e .
      - name: Test and assemble static site
        run: |
          python3 -m unittest -v tests.test_project_pages tests.test_observable_cities
          python3 scripts/build_project_pages.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
