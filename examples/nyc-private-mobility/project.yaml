schema: openmapstack-project/v1
project:
  id: nyc-private-mobility
  title: Northstar Mobility — NYC operations/charging hub candidates (tenant alpha)
  question: Identify promising NYC areas for a new operations/charging hub for tenant alpha, using current
    fleet and hub coverage and account demand, and show ranked candidate zones on an interactive map while
    respecting all database access restrictions.
  created_at: '2026-09-17T00:00:00Z'
  updated_at: '2026-09-17T13:13:53.286115+00:00'
  status: validated
interpretation:
  objective: Rank NYC taxi zones as operations/charging-hub candidates for tenant alpha from PostGIS operational
    snapshots (account demand, fleet coverage, distance to existing hubs), under the fixture's enforced
    security model (row-level security, withheld columns, inaccessible relations).
  assumptions:
  - id: A1
    statement: All private snapshots were retrieved through the restricted reader oms_alpha_reader, so
      row-level security confines them to tenant_id = 'alpha'; protected columns (contact_name, contact_email,
      contract_value) are withheld by column grants and hr.driver_private is inaccessible.
    rationale: The fixture's security boundary is backend-enforced, not filtered in the pipeline.
  - id: A2
    statement: Until the BigQuery leg lands (issue 43), historical trip demand is proxied by active tenant-alpha
      customer accounts per zone.
    rationale: Account density is the only tenant-visible demand signal available in the PostGIS-only
      skeleton stage; the scoring weights below are unchanged when the real demand snapshot replaces it.
  - id: A3
    statement: Distance to the closest existing hub is measured from the zone centroid in EPSG:32618 (UTM
      18N, metres).
    rationale: A metric, area-true CRS for NYC; centroid-level screening is appropriate for zone-level
      siting.
  - id: A4
    statement: Market/amenity context (MotherDuck) is unavailable in this stage and contributes 0 to every
      zone's score.
    rationale: The scoring weights stay fixed to the canonical model (45/30/15/10) so the formula is already
      recomputable when the market snapshot arrives; no zone is advantaged by a missing source.
  - id: A5
    statement: Zone geometries are the fixture's deterministic synthetic grid stand-in (zone_source =
      'synthetic-grid') for real NYC TLC taxi-zone polygons.
    rationale: Keeps the fixture fully reproducible; replacing the zone geometry must not change any other
      table.
