overrides: []
processing:
  analysis_crs: EPSG:32618
  storage_crs: EPSG:4326
  steps:
  - id: load_zones
    operation: read
    source: taxi_zones
    output: zones_raw
  - id: load_hubs
    operation: read
    source: hubs
    output: hubs_raw
  - id: load_fleet
    operation: read
    source: fleet_positions
    expression: geom IS NOT NULL
    output: fleet_raw
  - id: load_accounts
    operation: read
    source: customer_accounts
    expression: is_active = true
    output: accounts_raw
  - id: project_zones
    operation: project
    input: zones_raw
    expression: ST_Transform(geom, 32618)
    output: zones_metric
  - id: hub_distances
    operation: spatial_join
    inputs:
    - zones_metric
    - hubs_raw
    expression: min(ST_Distance(zone_centroid, hub_geom)) per zone
    crs: EPSG:32618
    output: zone_hub_distance
  - id: fleet_by_zone
    operation: aggregate
    input: fleet_raw
    expression: count(*) grouped by taxi_zone_id
    output: zone_fleet_counts
  - id: demand_by_zone
    operation: aggregate
    input: accounts_raw
    expression: count(*) grouped by taxi_zone_id (demand proxy, A2)
    output: zone_demand
  - id: combine_metrics
    operation: join
    inputs:
    - zones_raw
    - zone_hub_distance
    - zone_fleet_counts
    - zone_demand
    output: zone_metrics
  - id: eligible_zones
    operation: filter
    input: zone_metrics
    expression: demand_accounts >= 40 AND hub_distance_m >= 1500 AND fleet_present <= 6
    output: eligible_candidates
  - id: score_candidates
    operation: score
    input: eligible_candidates
    expression: 100 * (0.45*demand_score + 0.30*coverage_gap_score + 0.15*market_score + 0.10*saturation_score)
    output: scored_candidates
  - id: export_candidates
    operation: export
    input: scored_candidates
    output: hub_candidates
scoring:
  weights:
    demand: 0.45
    coverage_gap: 0.3
    market: 0.15
    saturation: 0.1
  components:
    demand_score: demand_accounts / max eligible demand_accounts
    coverage_gap_score: hub_distance_m / max eligible hub_distance_m
    market_score: 0 in this stage (A4); (charging + parking context)/200 once the MotherDuck snapshot
      lands
    saturation_score: 1 - fleet_present / max eligible fleet_present
  final_score: 100 * sum(weight * component), rounded to 2 decimals; recomputable from data/derived/zone-metrics.parquet
    alone
  eligibility:
    demand_accounts_min: 40
    hub_distance_m_min: 1500
    fleet_present_max: 6
outputs:
  zone_metrics_parquet:
    path: data/derived/zone-metrics.parquet
    format: GeoParquet (EPSG:4326)
    generated_by: combine_metrics
  hub_candidates_parquet:
    path: data/derived/hub-candidates.parquet
    format: GeoParquet (EPSG:4326)
    generated_by: export_candidates
  hub_candidates_geojson:
    path: data/derived/hub-candidates.geojson
    format: GeoJSON (EPSG:4326)
    generated_by: export_candidates
validation:
  required:
  - geometry_valid
  - crs_known
  - row_count_gt_zero
  - no_null_zone_id
  - rls_scope_alpha_only
  - protected_columns_absent
  - score_components_complete
  domain_checks:
  - name: score_range
    expression: final_score >= 0 AND final_score <= 100
  - name: eligibility_thresholds
    expression: demand_accounts >= 40 AND hub_distance_m >= 1500 AND fleet_present <= 6
