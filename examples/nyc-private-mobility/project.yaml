schema: openmapstack-project/v1
project:
  id: nyc-private-mobility
  title: Northstar Mobility — NYC operations/charging hub candidates (tenant alpha)
  question: Identify promising NYC areas for a new operations/charging hub for tenant alpha, using current
    fleet and hub coverage and account demand, and show ranked candidate zones on an interactive map while
    respecting all database access restrictions.
  created_at: '2026-09-17T00:00:00Z'
  updated_at: '2026-09-23T10:38:33.009731+00:00'
  status: validated
interpretation:
  objective: Rank NYC taxi zones as operations/charging-hub candidates for tenant alpha by combining three
    private backends — historical trip demand from the BigQuery warehouse, fleet and hub coverage from
    the operational PostGIS database, and market/POI context from the MotherDuck overlay — under each
    backend's enforced security model (row-level security and row access policies, withheld columns, inaccessible
    relations).
  assumptions:
  - id: A1
    statement: 'Every private snapshot was retrieved through that backend''s restricted analysis identity,
      so the rows in it are the rows those identities may see: PostGIS row-level security and the BigQuery
      row access policy both confine the data to tenant_id = ''alpha'', protected columns (contact_name,
      contact_email, contract_value) are withheld by column grants, and hr.driver_private and the restricted
      BigQuery dataset are inaccessible.'
    rationale: The fixture's security boundary is backend-enforced, never filtered in the pipeline; a
      WHERE clause here would hide whether the boundary works.
  - id: A2
    statement: Historical demand is the tenant-alpha trip total per zone over the 30 days in the BigQuery
      warehouse (trips_total), with trips_peak_day and trips_stddev_day carried alongside as the peak
      and variability evidence.
    rationale: Demand over time is the one input the operational database cannot answer; active account
      counts describe today and are kept as a separate column, not as the demand signal.
  - id: A3
    statement: Distance to the closest existing hub is measured from the zone centroid in EPSG:32618 (UTM
      18N, metres).
    rationale: A metric, area-true CRS for NYC; centroid-level screening is appropriate for zone-level
      siting.
  - id: A4
    statement: 'Market context combines Northstar''s own per-zone score with what is physically in the
      zone: amenities (charging, parking, transit) help and competitors do not, saturating at 6 amenity
      POIs and 3 competitor POIs respectively.'
    rationale: The saturation points keep one dense zone from dominating the component, and every input
      is stored in zone-metrics.parquet so the market score can be recomputed and disagreed with.
  - id: A5
    statement: Zone geometries are the fixture's deterministic synthetic grid stand-in (zone_source =
      'synthetic-grid') for real NYC TLC taxi-zone polygons.
    rationale: Keeps the fixture fully reproducible; replacing the zone geometry must not change any other
      table.
