    type: map_with_sidebar
  map:
    basemap:
      id: cartodb-positron
      kind: vector-style
      url: https://basemaps.cartocdn.com/gl/positron-gl-style/style.json
      attribution: © OpenStreetMap contributors © CARTO
      default_visible: true
    layers:
    - source: hub_candidates_geojson
      semantic_role: primary_result
    - source: zone_metrics_geojson
      semantic_role: context
    layer_groups:
    - id: result
      title: Hub Candidates (ranked, tenant alpha)
    - id: context
      title: Basemap Context
  provenance_ui:
    distinctions:
    - public-origin reference geometry (taxi_zones; synthetic grid stand-in, assumption A5)
    - private operational snapshots, PostGIS (hubs, fleet_positions, customer_accounts)
    - 'private warehouse snapshot, BigQuery (zone_demand: historical trip demand)'
    - 'private market overlay, MotherDuck (zone_market: POI and competitor context)'
    - 'RLS-limited sources: hubs, fleet_positions, customer_accounts (PostGIS row-level security) and
      zone_demand (BigQuery row access policy) — all confined to tenant alpha'
    - 'column-protected source: customer_accounts (contact_name, contact_email, contract_value withheld
      by column grants)'
    - 'never republished: market.analyst_annotations informs the MotherDuck scores and is not exported'
    - synthetic business attributes (all fixture tables, seed 20260917)
    - analysis assumptions (A1-A5)
  intent: analytical_workspace
  primary_view: map
